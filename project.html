:root {

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
a { text-decoration: none; color: inherit; }
.container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

/* Header */
header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: var(--primary-dark);
  border-bottom: 2px solid var(--gold);
}
.header-inner {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 30px; max-width: 1400px; margin: 0 auto;
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon {
  width: 45px; height: 45px; background: var(--gold); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: var(--primary-dark); font-weight: 800;
}
.logo-text { color: var(--white); font-size: 20px; font-weight: 700; }
.logo-text span { color: var(--gold); }
.back-link {
  color: var(--gold); font-weight: 600; font-size: 14px;
  display: flex; align-items: center; gap: 6px; transition: 0.3s;
}
.back-link:hover { gap: 10px; }

/* Hero */
.project-hero {
  margin-top: 73px;
  min-height: 400px;
  background-size: cover; background-position: center;
  position: relative; display: flex; align-items: flex-end;
}
.project-hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(transparent 20%, rgba(8,37,48,0.95));
}
.project-hero-content {
  position: relative; z-index: 1; padding: 40px 20px; color: var(--white); width: 100%;
}
.project-hero h1 { font-size: 36px; font-weight: 800; }
.project-hero .location { color: var(--gold); font-size: 16px; margin-top: 6px; display: flex; align-items: center; gap: 6px; }

/* Content */
.content { flex: 1; padding: 40px 0; }
.content-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
.content-full { grid-column: 1 / -1; }

/* Info cards */
.info-card {
  background: var(--white); border-radius: 14px; padding: 28px; margin-bottom: 24px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.05);
}
.info-card h3 {
  font-size: 20px; color: var(--primary); margin-bottom: 16px;
  padding-bottom: 10px; border-bottom: 2px solid var(--gold); display: inline-block;
}
.info-row {
  display: flex; justify-content: space-between; padding: 10px 0;
  border-bottom: 1px solid #f0f0f0; font-size: 14px;
}
.info-row:last-child { border-bottom: none; }
.info-key { color: var(--text-light); }
.info-value { color: var(--primary); font-weight: 700; }

/* Description */
.desc-text { line-height: 2; color: var(--text-light); font-size: 15px; }

/* Specs grid */
.specs-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 14px; }
.spec-item {
  padding: 10px 14px; background: var(--bg); border-radius: 8px;
  font-size: 13px; color: var(--primary); font-weight: 600;
  display: flex; align-items: center; gap: 8px;
}
.spec-icon { font-size: 16px; }

/* Contact CTA */
/* Gallery */
.gallery {margin-top:30px}
.gallery h3{font-size:20px;color:var(--primary);margin-bottom:16px;padding-bottom:10px;border-bottom:2px solid var(--gold);display:inline-block}
.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}

.gallery-item:hover{transform:scale(1.02);box-shadow:0 6px 20px rgba(0,0,0,.12)}
.gallery-item img{width:100%;height:100%;object-fit:cover;display:block}
.gallery-item .gallery-badge{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;padding:4px 10px;border-radius:6px}
/* Lightbox */
.lightbox{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s}
.lightbox.open{opacity:1;pointer-events:auto}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:8px}
.lightbox .close-lb{position:absolute;top:20px;left:20px;color:#fff;font-size:30px;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.1);border-radius:50%;border:none}
.lightbox .close-lb:hover{background:rgba(255,255,255,.2)}
.lightbox .nav-lb{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:36px;cursor:pointer;padding:12px;background:rgba(255,255,255,.08);border-radius:50%;width:52px;height:52px;display:flex;align-items:center;justify-content:center;border:none;transition:.2s}
.lightbox .nav-lb:hover{background:rgba(255,255,255,.2)}
.lightbox .nav-lb.prev{right:20px}
.lightbox .nav-lb.next{left:20px}

// Load project
const params = new URLSearchParams(window.location.search);
const id = params.get('id') || 'project-12m';
const project = projects[id];

if (project) {
  document.title = project.name + ' | مشكاة للتسويق العقاري';
  document.getElementById('pageTitle').textContent = project.name + ' | مشكاة';
  document.getElementById('projectName').textContent = project.name;
  document.getElementById('projectLocation').textContent = '📍 ' + project.location;
  if (project.img) {
    document.getElementById('projectHero').style.backgroundImage = "url('"+project.img+"')";
    document.getElementById('projectHero').style.backgroundSize = 'cover';
    document.getElementById('projectHero').style.backgroundPosition = 'center';
  } else {
    document.getElementById('projectHero').style.background = 'linear-gradient(135deg, #0d3b4f, #082530)';
  }
  document.getElementById('projectDesc').textContent = project.description;

  // Details
  const detailsDiv = document.getElementById('projectDetails');
  project.details.forEach(d => {
    detailsDiv.innerHTML += '<div class="info-row"><span class="info-key">' + d.key + '</span><span class="info-value">' + d.value + '</span></div>';
  });

  // Features
  const featuresDiv = document.getElementById('projectFeatures');
  project.features.forEach(f => {
    featuresDiv.innerHTML += '<div class="spec-item"><span class="spec-icon">✦</span>' + f + '</div>';
  });

  // Gallery
  const galleryDiv = document.getElementById('projectGallery');
  let galleryImages = [];
  if (project.img) {
    galleryImages.push({src:project.img,label:'صورة المشروع الرئيسية'});
  }
  galleryImages.forEach(img => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.innerHTML = '<img src="'+img.src+'" alt="'+project.name+'" loading="lazy"><div class="gallery-badge">'+img.label+'</div>';
    item.onclick = () => openLB(galleryImages, galleryImages.indexOf(img));
    galleryDiv.appendChild(item);
  });
  // No placeholder - gallery only shows available images

  document.getElementById('loading').style.display = 'none';
  document.getElementById('projectContent').style.display = 'block';
} else {
  document.getElementById('loading').innerHTML = 'المشروع غير موجود';
}

// Lightbox
let lbImages = [], lbIndex = 0;
function openLB(imgs, idx) {
  lbImages = imgs; lbIndex = idx;
  const lb = document.getElementById('lightbox');
  document.getElementById('lbImg').src = imgs[idx].src;
  lb.classList.add('open');
}
function closeLB(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('lightbox').classList.remove('open');
}
function navLB(dir) {
  lbIndex = (lbIndex + dir + lbImages.length) % lbImages.length;
  document.getElementById('lbImg').src = lbImages[lbIndex].src;
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeLB();
  if (e.key === 'ArrowRight') navLB(1);
  if (e.key === 'ArrowLeft') navLB(-1);
});
</script>
